databases:
  - name: novel-mvp-db
    plan: free             # 🔸 まずは Free で
    databaseName: novel_mvp_production  # 任意
    user: novel_mvp        # 任意

services:
  - type: redis            # 💎 Redis の実体
    name: cache
    plan: free

  - type: web
    name: barefoot
    runtime: ruby
    plan: free
    buildCommand: |
      bundle install
      bundle exec rake assets:precompile
      bundle exec rake assets:clean
    releaseCommand: bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb -t 5:5 -p ${PORT:-3000}
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: novel-mvp-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache
          property: connectionString
