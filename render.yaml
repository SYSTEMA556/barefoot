services:
  - type: web
    name: barefoot
    runtime: ruby
    plan: free
    buildCommand: "bundle install; bundle exec rake assets:precompile; bundle exec rake assets:clean;"
    releaseCommand: "bundle exec rails db:migrate"
    startCommand: "bundle exec puma -C config/puma.rb -t 5:5 -p ${PORT:-3000}"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novel-mvp-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache
          property: connectionString
