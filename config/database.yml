default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>  # ← 数値！
  timeout: 5000                                   # ← フラットに書く！

development:
  <<: *default
  database: novel_mvp_development
  username: postgres
  password: password     # ← 上で設定したもの
  host: localhost

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
